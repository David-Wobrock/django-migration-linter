name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      mysql:
        image: mysql:26.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    name: Build with Python ${{ matrix.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        # Fetch all tags and branches because tests rely on it
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install tox==4.61.4 tox-gh-actions
      - name: Test with tox ${{ matrix.python-version }}
        run: tox

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python 3.15
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install dependencies
        run: python -m pip install tox==4.61.4
      - name: Lint with tox
        run: tox
        env:
          TOXENV: lint
