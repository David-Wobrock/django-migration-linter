[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "django-migration-linter"
version = "6.0.0"
description = "Detect backward incompatible migrations for your django project"
authors = [
  { name="David Wobrock", email="david.wobrock@gmail.com" },
  { name="3YOURMIND GmbH", email="fb@3yourmind.com" },
]
maintainers = [{name = "David Wobrock", email = "david.wobrock@gmail.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2",
    "appdirs>=1.4.3",
    "toml>=0.10.2",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
keywords = [
    "django",
    "migration",
    "lint",
    "linter",
    "database",
    "backward",
    "compatibility",
]

[project.urls]
Changelog = "https://github.com/David-Wobrock/django-migration-linter/blob/main/CHANGELOG.md"
Repository = "https://github.com/David-Wobrock/django-migration-linter"

[tool.setuptools.package-data]
django_migration_linter = ['py.typed']

[project.optional-dependencies]
test = [
    "tox>=4.61.4",
    "mysqlclient>=2.2.8",
    "psycopg2>=2.9.13",
    "django_add_default_value>=0.10.0",
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = "True"
force_grid_wrap = 0
use_parentheses = "True"
ensure_newline_before_comments = "True"
line_length = 88
add_imports = [ "from __future__ import annotations" ]
